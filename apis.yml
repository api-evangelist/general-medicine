aid: general-medicine
name: General Medicine
description: 'General Medicine is a consumer digital-health company building a healthcare
  storefront for the age of AI, making it delightfully simple to access the best care
  in the world. Founded by PillPack alumni Elliot Cohen and TJ Parker with CEO Ashwin
  Muralidharan, the company operates as part telehealth provider, part medical concierge,
  and part marketplace for browsing and booking medical care, prescriptions, and diagnostic
  lab testing across more than 35 specialties with board-certified clinicians, transparent
  pricing, and no waitlists. It is backed by roughly $32M led by Matrix Partners, with
  BoxGroup, Founder Collective, VXI Capital, and JSL Health Capital participating. General
  Medicine runs a consumer web storefront (generalmedicine.co) and does not currently
  publish a public developer API, SDKs, or developer portal.'
